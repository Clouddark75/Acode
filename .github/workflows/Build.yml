name: Build APK from AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (free/paid)'
        required: true
        default: 'paid'
        type: choice
        options:
          - 'free'
          - 'paid'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'yarn'

    - name: Enable Corepack
      run: corepack enable

    - name: Install dependencies and set up project
      run: yarn setup

    - name: Build unsigned release AAB
      run: yarn build android ${{ inputs.build_type }} dev

    - name: Build unsigned release APK
      working-directory: platforms/android
      run: ./gradlew assembleRelease

    - name: Upload unsigned release APK
      uses: actions/upload-artifact@v7
      with:
        name: app-release-unsigned.apk
        path: platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload unsigned release AAB
      uses: actions/upload-artifact@v7
      with:
        name: app-release.aab
        path: platforms/android/app/build/outputs/bundle/release/app-release.aab
